Sandstorm:
  BackendUserManagement:
    # User management: "forgot password", initial password via mail, email validation and a backend module
    # replacing the core user module. ON by default (requires mail.from.address); the backend module and
    # usernameIsEmail are optional - see README "User management".
    userManagement:
      # Gates the public endpoints (forgot password, set password, confirm email), the login screen link
      # and the CLI commands. The backend module is toggled via its "enabled" flag below.
      enabled: true
      # Only accounts of these providers are managed / can reset their password.
      authenticationProviders: ['Neos.Neos:Backend']
      # Forgot password only sends a mail to validated (approved) primary email addresses.
      requireValidatedEmail: true
      # On create, the account identifier is the email address; the username field is hidden.
      # Changing the email later renames accounts named after the old email once the new one is validated.
      usernameIsEmail: false
      # ISO 8601 durations
      tokenLifetime:
        resetPassword: 'PT24H'
        initialPassword: 'P7D'
        verifyEmail: 'P7D'
      # Forgot-password throttle (symfony/rate-limiter, sliding window). The limiter state is kept in the Flow cache
      # Sandstorm_BackendUserManagement_Throttle.
      throttle:
        perIdentifier:
          limit: 3
          window: 'PT15M'
        # Only a safety net against one client mailing many accounts - generous on purpose. Behind a reverse proxy,
        # set Neos.Flow.http.trustedProxies, or every request counts for the proxy's IP and the limit becomes a global
        # one. Disable it if you can't (or a WAF / the ingress limits requests already).
        perIp:
          enabled: true
          limit: 2
          window: 'PT15M'
        # symfony/lock store DSN, see Symfony\Component\Lock\Store\StoreFactory - e.g. 'flock' (local file
        # system) or 'redis://redis:6379'
        lockStore: 'flock'
      # Mirrors the core user module (Neos\Neos\Validation\Validator\PasswordValidator, minimum 1).
      passwordPolicy:
        minimumLength: 1
        maximumLength: 255
      mail:
        # REQUIRED once enabled - sending fails loudly if unset.
        # Links in mails are built from Neos.Flow.http.baseUri (required for the CLI commands) or the current request.
        from:
          address: ~
          name: 'Neos'

Flowpack:
  JobQueue:
    Common:
      queues:
        # Forgot-password mails are sent via this queue, so the response time does not reveal whether an account
        # exists. The async FakeQueue runs each job in a background `./flow` process - no worker needed. With a real
        # queue (e.g. Flowpack.JobQueue.Redis), override className and run `./flow job:work` for it.
        # Never set `async: false` - the request would then wait for the mail again.
        'Sandstorm.BackendUserManagement:UserManagementMail':
          className: 'Flowpack\JobQueue\Common\Queue\FakeQueue'
          options:
            async: true

Neos:
  Neos:
    userInterface:
      backendLoginForm:
        stylesheets:
          'Sandstorm.BackendUserManagement:UserManagementStyles': 'resource://Sandstorm.BackendUserManagement/Public/Styles/UserManagementLogin.css'
    modules:
      administration:
        submodules:
          userManagement:
            # Optional. Requires userManagement.enabled; disable the core module when enabling it
            # (Neos.Neos.modules.administration.submodules.users.enabled: false)
            enabled: false
            label: 'Sandstorm.BackendUserManagement:UserManagement:module.label'
            controller: 'Sandstorm\BackendUserManagement\UserManagement\Controller\ModuleController'
            description: 'Sandstorm.BackendUserManagement:UserManagement:module.description'
            icon: 'fas fa-users'
            mainStylesheet: 'Lite'
            additionalResources:
              styleSheets:
                - 'resource://Sandstorm.BackendUserManagement/Public/Styles/UserManagement.css'

  Flow:
    security:
      authentication:
        providers:
          'Neos.Neos:Backend':
            requestPatterns:
              'Sandstorm.BackendUserManagement:UserManagementModule':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 'Sandstorm\BackendUserManagement\UserManagement\Controller\ModuleController'
