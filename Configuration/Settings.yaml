Neos:
  Neos:
    fusion:
      autoInclude:
        'Sandstorm.BackendUserManagement': true
    modules:
      management:
        submodules:
          twoFactorAuthentication:
            controller: 'Sandstorm\BackendUserManagement\SecondFactor\Controller\ModuleController'
            label: 'Sandstorm.BackendUserManagement:SecondFactor:module.label'
            description: 'Sandstorm.BackendUserManagement:SecondFactor:module.description'
            icon: 'fas fa-qrcode'
            additionalResources:
              styleSheets:
                - 'resource://Sandstorm.BackendUserManagement/Public/Styles/SecondFactorShared.css'
                - 'resource://Sandstorm.BackendUserManagement/Public/Styles/SecondFactor.css'
              javaScripts:
                - 'resource://Sandstorm.BackendUserManagement/Public/JavaScript/totpSecret.js'
                - 'resource://Sandstorm.BackendUserManagement/Public/JavaScript/webauthn.js'

    userInterface:
      translation:
        autoInclude:
          'Sandstorm.BackendUserManagement':
            - '*'

      backendLoginForm:
        stylesheets:
          'Sandstorm.BackendUserManagement:MainStyles': 'resource://Sandstorm.BackendUserManagement/Public/Styles/Main.css'
        scripts:
          'Sandstorm.BackendUserManagement:SecondFactorScripts': 'resource://Sandstorm.BackendUserManagement/Public/JavaScript/totpSecret.js'
          'Sandstorm.BackendUserManagement:WebAuthnScripts': 'resource://Sandstorm.BackendUserManagement/Public/JavaScript/webauthn.js'

    Ui:
      resources:
        javascript:
          'Sandstorm.BackendUserManagement:ReloadOnAuthTimeout':
            resource: 'resource://Sandstorm.BackendUserManagement/Public/Neos.Ui/Plugin.js'

  Flow:
    http:
      middlewares:
        'secondFactorRedirectMiddleware':
          middleware: 'Sandstorm\BackendUserManagement\SecondFactor\Http\Middleware\SecondFactorMiddleware'
          position: 'after securityEntryPoint'
    mvc:
      routes:
        'Sandstorm.BackendUserManagement': true

    security:
      authentication:
        providers:
          'Neos.Neos:Backend':
            requestPatterns:
              'Sandstorm.BackendUserManagement:SecondFactor':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 'Sandstorm\BackendUserManagement\SecondFactor\Controller\(LoginController|ModuleController)'
          # Parallel provider for usernameless passwordless passkey login. It has NO request
          # pattern, so its token is always active and can be authenticated in-request by the
          # PasswordlessLoginController; and NO entry point, so the existing Neos.Neos:Backend
          # WebRedirect still serves the login screen. With Neos' `oneToken` strategy, an
          # authenticated token here logs the (Neos.Neos:Backend) account into the backend.
          'Sandstorm.BackendUserManagement:PasswordlessWebAuthn':
            provider: 'Sandstorm\BackendUserManagement\SecondFactor\Security\Authentication\WebAuthnPasswordlessProvider'
            token: 'Sandstorm\BackendUserManagement\SecondFactor\Security\Token\WebAuthnPasswordlessToken'
