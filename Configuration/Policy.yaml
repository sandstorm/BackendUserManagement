privilegeTargets:

  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':

    'Sandstorm.BackendUserManagement:SecondFactor.Login':
      matcher: 'method(Sandstorm\BackendUserManagement\SecondFactor\Controller\LoginController->(.*)Action())'

    'Sandstorm.BackendUserManagement:SecondFactor.Module':
      matcher: 'method(Sandstorm\BackendUserManagement\SecondFactor\Controller\ModuleController->(.*)Action())'

    # Passwordless login must work for not-yet-authenticated users, so it has to be exempt from
    # the Neos.Neos:AllControllerActions privilege (which requires a backend role). The actions
    # are still hard-gated at runtime by the `secondFactor.webAuthn.passwordlessLoginEnabled` setting.
    'Sandstorm.BackendUserManagement:SecondFactor.PasswordlessLogin':
      matcher: 'method(Sandstorm\BackendUserManagement\SecondFactor\Controller\PasswordlessLoginController->(options|verify)Action())'

    # User management: forgot password / set password / confirm email must work unauthenticated. The token
    # in the link is the authorization; the actions are hard-gated at runtime by `userManagement.enabled`.
    'Sandstorm.BackendUserManagement:UserManagement.PublicActions':
      matcher: 'method(Sandstorm\BackendUserManagement\UserManagement\Controller\(PasswordController|EmailVerificationController)->(?!initialize).*Action())'

    'Sandstorm.BackendUserManagement:UserManagement.Module':
      matcher: 'method(Sandstorm\BackendUserManagement\UserManagement\Controller\ModuleController->(?!initialize).*Action())'

  'Neos\Neos\Security\Authorization\Privilege\ModulePrivilege':

    'Sandstorm.BackendUserManagement:Backend.Module.Administration.UserManagement':
      label: General access to the user management module
      matcher: 'administration/userManagement'

roles:
  'Neos.Flow:Everybody':
    privileges:
      -
        privilegeTarget: 'Sandstorm.BackendUserManagement:SecondFactor.PasswordlessLogin'
        permission: GRANT
      -
        privilegeTarget: 'Sandstorm.BackendUserManagement:UserManagement.PublicActions'
        permission: GRANT

  'Neos.Neos:AbstractEditor':
    privileges:
      -
        privilegeTarget: 'Sandstorm.BackendUserManagement:SecondFactor.Login'
        permission: GRANT
      -
        privilegeTarget: 'Sandstorm.BackendUserManagement:SecondFactor.Module'
        permission: GRANT

  # Same as the core user module: user managers may manage users having the same or a subset of their roles
  'Neos.Neos:UserManager':
    privileges:
      -
        privilegeTarget: 'Sandstorm.BackendUserManagement:UserManagement.Module'
        permission: GRANT
      -
        privilegeTarget: 'Sandstorm.BackendUserManagement:Backend.Module.Administration.UserManagement'
        permission: GRANT

  'Neos.Neos:Administrator':
    privileges:
      -
        privilegeTarget: 'Sandstorm.BackendUserManagement:SecondFactor.Module'
        permission: GRANT
      -
        privilegeTarget: 'Sandstorm.BackendUserManagement:UserManagement.Module'
        permission: GRANT
      -
        privilegeTarget: 'Sandstorm.BackendUserManagement:Backend.Module.Administration.UserManagement'
        permission: GRANT
