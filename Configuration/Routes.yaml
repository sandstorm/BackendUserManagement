- name: 'Sandstorm Second Factor'
  uriPattern: 'neos/second-factor-login'
  httpMethods: ['GET']
  defaults:
    '@package': 'Sandstorm.BackendUserManagement'
    '@subpackage': 'SecondFactor'
    '@controller': 'Login'
    '@action': 'askForSecondFactor'
    '@format': 'html'
  appendExceedingArguments: true

- name: 'Sandstorm Second Factor - Validation'
  uriPattern: 'neos/second-factor-login'
  httpMethods: ['POST']
  defaults:
    '@package': 'Sandstorm.BackendUserManagement'
    '@subpackage': 'SecondFactor'
    '@controller': 'Login'
    '@action': 'checkSecondFactor'
